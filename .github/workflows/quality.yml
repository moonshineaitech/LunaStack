name: Quality Score

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Run skill validation (Tier 1)
        run: bash tests/validate_skills.sh

      - name: Run integrity checks
        run: bash tests/validate_integrity.sh

      - name: Run quality scoring (Tier 2)
        run: bash tests/quality_score.sh

      - name: Run health-skill safety gate (disclaimer + escalation)
        run: bash tests/validate_health_skills.sh

      - name: Run wiki-skill behavior-grade validation
        run: bash tests/validate_wiki_skills.sh

      - name: Run discovery context-tax audit
        run: bash tests/context_cost.sh

      - name: Check LunaStack.md is in sync with skills
        run: bash build.sh --check
