name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve release tag
        run: |
          version="$(tr -d ' \n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "$version" ]; then
              printf 'ERROR: tag %s does not match VERSION file (%s)\n' "$tag" "$version"
              exit 1
            fi
          else
            # workflow_dispatch: derive the tag from VERSION; gh will create it
            tag="v$version"
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"

      - name: Verify distribution is in sync
        run: bash build.sh --check

      - name: Extract release notes from CHANGELOG
        run: |
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            printf 'No CHANGELOG entry for %s\n' "$version" > /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists — nothing to do.\n' "$RELEASE_TAG"
            exit 0
          fi
          # --target creates the tag at this commit if it does not exist yet
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LunaStack $RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            LunaStack.md
